<svg width="1280" height="990" viewBox="0 0 1280 990" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Data flow diagram for did:webvh with witnesses, watchers and DNS-linking. The DID controller collects witness proofs for each candidate log entry, publishes the DID Log, witness proofs, an optional parallel did:web document and DID URL path resources to a web server, notifies watchers, and publishes a _did DNS record that links the domain to the DID. Watchers cache logs by SCID. Resolvers fetch the log and witness proofs over HTTPS, may cross-check a watcher and the _did record, verify everything, and return the DID document to a DID-enabled application. Six trust boundaries, T1 to T6, are marked.">
<style>
svg{color:#1c2330;background:#ffffff}
text{font-family:"IBM Plex Sans",Arial,sans-serif;font-size:11.5px;fill:#1c2330}
.id{font-family:"IBM Plex Mono",Menlo,monospace;font-weight:600}
.small{font-size:10.5px;fill:#5a6474}
.halo{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
.ent,.proc,.obj{fill:#ffffff;stroke:#1c2330;stroke-width:1.4}
.ctr{fill:none;stroke:#1c2330;stroke-width:1.2;stroke-dasharray:7 5;opacity:.7}
.st{stroke:#1c2330;stroke-width:1.4}
.fl{fill:none;stroke:#1c2330;stroke-width:1.3}
.dep{stroke-dasharray:2 4}
.op{stroke:#1c2330;stroke-width:1;opacity:.55}
.tb{stroke:#1c2330;stroke-width:1.3;stroke-dasharray:7 5}
.nw{stroke:#0a6c7b}.nwt{fill:#0a6c7b}
.ah{fill:#1c2330}.ahn{fill:#0a6c7b}
.tag rect{fill:#ffffff;stroke:#1c2330;stroke-width:1.2}
.tag text{font-family:"IBM Plex Mono",Menlo,monospace;font-weight:600;font-size:11px}
.tag.nw rect{stroke:#0a6c7b}.tag.nw text{fill:#0a6c7b}
</style><defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
  <marker id="ahn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahn"/></marker>
</defs>

<!-- ===== Containers ===== -->
<rect class="ctr nw" x="430" y="14" width="420" height="120" rx="10"/>
<text x="442" y="32"><tspan class="id">C6</tspan> DNS &amp; Web PKI</text>
<text class="small" x="442" y="46">dependency, black box</text>

<rect class="ctr" x="30" y="240" width="330" height="230" rx="10"/>
<text x="348" y="260" text-anchor="end"><tspan class="id">C1</tspan> Controller Device</text>

<rect class="ctr" x="450" y="230" width="380" height="350" rx="10"/>
<text x="462" y="250"><tspan class="id">C2†</tspan> Web Server (DID host)</text>

<rect class="ctr" x="910" y="230" width="340" height="240" rx="10"/>
<text x="1238" y="250" text-anchor="end"><tspan class="id">C4</tspan> Resolver Device</text>

<rect class="ctr" x="910" y="540" width="340" height="200" rx="10"/>
<text x="922" y="560"><tspan class="id">C3</tspan> Client Device</text>

<rect class="ctr nw" x="30" y="580" width="310" height="210" rx="10"/>
<text x="328" y="600" text-anchor="end"><tspan class="id nwt">C7*</tspan> Witness (one of n)</text>

<rect class="ctr nw" x="450" y="680" width="380" height="210" rx="10"/>
<text x="818" y="700" text-anchor="end"><tspan class="id nwt">C5†</tspan> Watcher (any party)</text>

<!-- ===== Operator lines ===== -->
<line class="op" x1="420" y1="72" x2="430" y2="72"/>
<line class="op" x1="520" y1="194" x2="520" y2="230"/>
<line class="op" x1="1165" y1="194" x2="1165" y2="230"/>
<line class="op" x1="115" y1="790" x2="115" y2="820"/>
<line class="op" x1="535" y1="890" x2="535" y2="920"/>

<!-- ===== Flows ===== -->
<!-- F1 -->
<line class="fl" x1="130" y1="194" x2="143" y2="271" marker-end="url(#ah)"/>
<text class="halo" x="128" y="232" text-anchor="end"><tspan class="id">F1</tspan> Manage DID</text>
<!-- F2 -->
<line class="fl nw" x1="194" y1="305" x2="594" y2="305" marker-end="url(#ahn)"/>
<text class="halo" x="275" y="297" text-anchor="middle"><tspan class="id nwt">F2†</tspan> Publish (deploy)</text>
<!-- F3a -->
<polyline class="fl nw" points="184,345 395,345 395,770 514,770" marker-end="url(#ahn)"/>
<text class="halo" x="283" y="362" text-anchor="middle"><tspan class="id nwt">F3a†</tspan> Notify watcher</text>
<!-- F3b -->
<line class="fl nw" x1="560" y1="560" x2="560" y2="724" marker-end="url(#ahn)"/>
<text class="halo" x="570" y="618"><tspan class="id nwt">F3b†</tspan> Retrieve log, witness file, resources</text>
<!-- F11 -->
<line class="fl nw" x1="115" y1="345" x2="115" y2="631" marker-start="url(#ahn)" marker-end="url(#ahn)"/>
<text class="halo" x="124" y="518"><tspan class="id nwt">F11*</tspan> Candidate entry,</text>
<text class="halo" x="124" y="533">witness proof</text>
<!-- F12 -->
<polyline class="fl nw" points="470,436 420,436 420,660 196,660" marker-end="url(#ahn)"/>
<text class="halo" x="300" y="652" text-anchor="middle"><tspan class="id nwt">F12*</tspan> Fetch published log</text>
<!-- F13 -->
<polyline class="fl nw" points="605,770 870,770 870,400 989,347" marker-end="url(#ahn)"/>
<text class="halo" x="862" y="656" text-anchor="end"><tspan class="id nwt">F13*</tspan> GET /log?scid=</text>
<!-- F7, F10, F9 -->
<line class="fl nw" x1="677" y1="280" x2="971" y2="280" marker-end="url(#ahn)"/>
<text class="halo" x="825" y="275" text-anchor="middle"><tspan class="id nwt">F7†</tspan> GET did.jsonl + did-witness.json</text>
<line class="fl" x1="686" y1="305" x2="964" y2="305" marker-end="url(#ah)"/>
<text class="halo" x="825" y="300" text-anchor="middle"><tspan class="id">F10</tspan> GET whois.vp, /path files</text>
<line class="fl" x1="677" y1="330" x2="971" y2="330" marker-end="url(#ah)"/>
<text class="halo" x="825" y="325" text-anchor="middle"><tspan class="id">F9</tspan> GET did.json (did:web)</text>
<!-- F8 (dependency) -->
<polyline class="fl dep" points="645,62 1000,62 1000,260" marker-end="url(#ah)"/>
<text class="halo" x="930" y="54" text-anchor="middle"><tspan class="id">F8</tspan> DNS (DoH) + TLS</text>
<line class="fl dep" x1="596" y1="96" x2="628" y2="262" marker-end="url(#ah)"/>
<text class="halo" x="618" y="205"><tspan class="id">F8</tspan></text>
<!-- F14 publish DNS link -->
<polyline class="fl nw" points="110,150 110,126 760,126 760,118" marker-end="url(#ahn)"/>
<text class="halo" x="300" y="120" text-anchor="middle"><tspan class="id nwt">F14*</tspan> Publish _did record</text>
<!-- F15 DNS-link lookup -->
<polyline class="fl dep nw" points="840,99 1040,99 1040,268" marker-end="url(#ahn)"/>
<text class="halo" x="935" y="90" text-anchor="middle"><tspan class="id nwt">F15*</tspan> _did lookup (DNSSEC)</text>
<!-- F6 -->
<line class="fl" x1="1030" y1="600" x2="1030" y2="346" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text class="halo" x="1022" y="512" text-anchor="end"><tspan class="id">F6</tspan> Resolve</text>
<!-- F5 -->
<line class="fl" x1="995" y1="800" x2="1003" y2="686" marker-end="url(#ah)"/>
<text class="halo" x="985" y="772" text-anchor="end"><tspan class="id">F5</tspan> Use DID URL</text>
<!-- F4 -->
<line class="fl" x1="1110" y1="822" x2="1061" y2="822" marker-end="url(#ah)"/>
<text class="halo" x="1085" y="792" text-anchor="middle"><tspan class="id">F4</tspan> Give DID URL</text>
<!-- T3 boundary line -->
<line class="tb" x1="1085" y1="806" x2="1085" y2="930"/>

<!-- ===== External entities ===== -->
<rect class="ent" x="270" y="50" width="150" height="44"/>
<text x="345" y="68" text-anchor="middle" class="id">E7</text>
<text x="345" y="84" text-anchor="middle">Registrar, DNS, CA</text>

<rect class="ent" x="455" y="150" width="130" height="44"/>
<text x="520" y="168" text-anchor="middle" class="id">E5†</text>
<text x="520" y="184" text-anchor="middle">Web Hosting Provider</text>

