<text x="265" y="748" text-anchor="middle">did:key secret</text>

<line class="st nw" x1="640" y1="800" x2="815" y2="800"/><line class="st nw" x1="640" y1="836" x2="815" y2="836"/>
<text x="727" y="815" text-anchor="middle"><tspan class="id nwt">D7†</tspan> Cache indexed</text>
<text x="727" y="830" text-anchor="middle">by SCID</text>

<line class="st" x1="1075" y1="398" x2="1240" y2="398"/><line class="st" x1="1075" y1="434" x2="1240" y2="434"/>
<text x="1157" y="413" text-anchor="middle"><tspan class="id">D6†</tspan> Cache: last-seen</text>
<text x="1157" y="428" text-anchor="middle">versionId, ttl</text>

<line class="st" x1="1075" y1="660" x2="1240" y2="660"/><line class="st" x1="1075" y1="690" x2="1240" y2="690"/>
<text x="1157" y="679" text-anchor="middle"><tspan class="id">D5</tspan> Client data store</text>

