<text x="110" y="168" text-anchor="middle" class="id">E1</text>
<text x="110" y="184" text-anchor="middle">DID Controller</text>

<rect class="ent" x="1090" y="150" width="150" height="44"/>
<text x="1165" y="168" text-anchor="middle" class="id">E4</text>
<text x="1165" y="184" text-anchor="middle">Resolver Provider</text>

<rect class="ent nw" x="40" y="820" width="150" height="44"/>
<text x="115" y="838" text-anchor="middle" class="id nwt">E8*</text>
<text x="115" y="854" text-anchor="middle">Witness Operator</text>

<rect class="ent nw" x="460" y="920" width="150" height="44"/>
<text x="535" y="938" text-anchor="middle" class="id nwt">E6†</text>
<text x="535" y="954" text-anchor="middle">Watcher Operator</text>

<rect class="ent" x="920" y="800" width="140" height="44"/>
<text x="990" y="818" text-anchor="middle" class="id">E2</text>
<text x="990" y="834" text-anchor="middle">DID URL User</text>

<rect class="ent" x="1110" y="800" width="140" height="44"/>
<text x="1180" y="818" text-anchor="middle" class="id">E3</text>
<text x="1180" y="834" text-anchor="middle">DID URL Author</text>

<!-- ===== Processes ===== -->
<ellipse class="proc" cx="590" cy="72" rx="55" ry="24"/>
<text x="590" y="68" text-anchor="middle" class="id">P6</text>
<text x="590" y="84" text-anchor="middle">DNS + CA</text>

<circle class="proc" cx="150" cy="315" r="45"/>
<text x="150" y="303" text-anchor="middle" class="id">P1†</text>
<text x="150" y="318" text-anchor="middle">Controller</text>
<text x="150" y="332" text-anchor="middle">App</text>

<circle class="proc" cx="640" cy="305" r="45"/>
<text x="640" y="293" text-anchor="middle" class="id">P2†</text>
<text x="640" y="308" text-anchor="middle">Web</text>
<text x="640" y="322" text-anchor="middle">Server</text>

<circle class="proc" cx="1010" cy="305" r="45"/>
<text x="1010" y="293" text-anchor="middle" class="id">P4†</text>
<text x="1010" y="308" text-anchor="middle">did:webvh</text>
<text x="1010" y="322" text-anchor="middle">Resolver</text>

<circle class="proc" cx="1010" cy="640" r="45"/>
<text x="1010" y="628" text-anchor="middle" class="id">P3</text>
<text x="1010" y="643" text-anchor="middle">DID-enabled</text>
<text x="1010" y="657" text-anchor="middle">App</text>

<circle class="proc nw" cx="150" cy="660" r="45"/>
<text x="150" y="648" text-anchor="middle" class="id nwt">P7*</text>
<text x="150" y="663" text-anchor="middle">Witness</text>
<text x="150" y="677" text-anchor="middle">Service</text>

<circle class="proc nw" cx="560" cy="770" r="45"/>
<text x="560" y="764" text-anchor="middle" class="id nwt">P5†</text>
<text x="560" y="780" text-anchor="middle">Watcher</text>

<!-- ===== Data stores ===== -->
<line class="st nw" x1="665" y1="82" x2="840" y2="82"/><line class="st nw" x1="665" y1="116" x2="840" y2="116"/>
<text x="752" y="96" text-anchor="middle"><tspan class="id nwt">D16*</tspan> _did TXT record</text>
<text x="752" y="110" text-anchor="middle">(DNS-linking, proposed)</text>

<line class="st" x1="180" y1="405" x2="345" y2="405"/><line class="st" x1="180" y1="445" x2="345" y2="445"/>
<text x="262" y="421" text-anchor="middle"><tspan class="id">D2†</tspan> Key store:</text>
<text x="262" y="437" text-anchor="middle">update + next keys</text>

